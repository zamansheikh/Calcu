name: calcu
description: Calcu is a simple calculator app built with Flutter. It provides basic arithmetic operations and a user-friendly interface for quick calculations.
publish_to: "none"
version: 4.0.0+23

environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter

  flutter_svg: ^2.2.1
  fluttertoast: ^9.0.0
  get_storage: ^2.1.1
  flutter_launcher_icons: ^0.14.4
  shared_preferences: ^2.5.3
  rename: ^3.1.0
  intl: ^0.20.2
  flex_color_scheme: ^8.3.0
  url_launcher: ^6.3.2
  logger: ^2.6.1
  get_it: ^9.2.1
  provider: ^6.1.5+1
  flutter_screenutil: ^5.9.3
  math_expressions: ^3.0.0
  package_info_plus: ^10.1.0
  purchases_flutter: ^10.0.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/temp/
    - assets/svg/
    - assets/icon/

  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-Black.ttf
          weight: 900
        - asset: assets/fonts/Urbanist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Urbanist-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Urbanist-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Urbanist-Light.ttf
          weight: 300
        - asset: assets/fonts/Urbanist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Urbanist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Urbanist-SemiBold.ttf
          weight: 600
